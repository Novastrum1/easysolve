services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: easysolve
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-development-only}
      POSTGRES_DB: easysolve
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U easysolve"]
      interval: 3s
      timeout: 3s
      retries: 20
volumes:
  postgres_data:
